{% extends "base.html" %}
{% block title %}Record Grade{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Record Grade</h1>
<form method="post" class="col-md-6">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="enrollment_id">Enrollment</label>
    <select class="form-select" id="enrollment_id" name="enrollment_id" required>
      <option value="" disabled selected>Choose...</option>
      {% for e in enrollments %}
      <option value="{{ e.EnrollmentID }}">{{ e.Fname }} {{ e.Lname }} &mdash; {{ e.CourseCode }} ({{ e.Semester }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label" for="assessment_id">Assessment</label>
    <select class="form-select" id="assessment_id" name="assessment_id" required>
      <option value="" disabled selected>Choose...</option>
      {% for a in assessments %}
      <option value="{{ a.AssessmentID }}">{{ a.CourseCode }} &mdash; {{ a.AssessmentType }} (max {{ a.MaxScore }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label" for="score">Score</label>
    <input class="form-control" type="number" step="0.01" min="0" id="score" name="score" required>
  </div>
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('grade.list_grades') }}">Cancel</a>
</form>
{% endblock %}
