{% extends "base.html" %}
{% block title %}Upload Course Material{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Upload Course Material</h1>
<form method="post" enctype="multipart/form-data" class="col-md-6">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="pick">Class</label>
    <select class="form-select" id="pick" name="pick" required onchange="
        const [cid, sem] = this.value.split('|');
        document.getElementById('course_id').value = cid;
        document.getElementById('semester').value = sem;
      ">
      <option value="" disabled selected>Choose...</option>
      {% for t in teaching %}
      <option value="{{ t.CourseID }}|{{ t.Semester }}">{{ t.CourseCode }} &mdash; {{ t.Semester }}</option>
      {% endfor %}
    </select>
    <input type="hidden" id="course_id" name="course_id">
    <input type="hidden" id="semester" name="semester">
  </div>
  <div class="mb-3">
    <label class="form-label" for="title">Title</label>
    <input class="form-control" id="title" name="title" maxlength="150" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="file">File</label>
    <input class="form-control" type="file" id="file" name="file" required>
  </div>
  <button class="btn btn-primary" type="submit">Upload</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('course_material.class_materials') }}">Cancel</a>
</form>
{% endblock %}
